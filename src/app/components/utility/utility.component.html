<div class="container">
    <div class="itemHead">
        <h2>Utilità</h2>
        <button mat-raised-button (click)="this.openNewUtilityDialog()"  ><mat-icon aria-hidden="false" aria-label="Ruota" fontIcon="add"  ></mat-icon>Aggiungi</button> 
     </div>   
     <div  *ngFor="let uti of this.utility" class="item" >

        <app-utility-item [item]="uti" (editUtilityEmitter)="editUtilityListener(uti)" (deleteUtilityEmitter)="deleteUtilityListener(uti.id)" />
    </div>
</div>
