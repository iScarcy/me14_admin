<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title><a :href={{item.fileFullPath}} target="_blank">{{item.name}}</a></mat-card-title>
      <mat-card-subtitle>{{item.type}}</mat-card-subtitle>
      <img mat-card-sm-image src="{{itemImage(item.typeID)}}" >
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-actions class="row justify-content-center align-items-center">
      <button mat-raised-button (click)="editUtility(item)" >Modifica</button>
      <button mat-raised-button>Elimina</button>
  </mat-card-actions>
</mat-card>
