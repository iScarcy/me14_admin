<div class="expiry-dialog">
  <div class="expiry-icon" aria-hidden="true">
    <mat-icon>schedule</mat-icon>
  </div>
  <h2 mat-dialog-title>Sessione scaduta</h2>
  <mat-dialog-content>
    La sessione è scaduta. Verrai reindirizzato alla pagina di accesso per effettuare nuovamente il login.
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-flat-button color="primary" (click)="continueToLogin()">Continua</button>
  </mat-dialog-actions>
</div>
