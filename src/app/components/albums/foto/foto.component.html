<h2 mat-dialog-title>{{this.al?.title}}</h2>
<mat-dialog-content>
<div class="container">
       
        <div class="item"  *ngFor="let ph of this.al?.foto">
            
            <mat-card appearance="outlined">
               
                <img mat-card-image src="{{ph.thumbPathFile}}"  >
                
                <mat-card-actions class="row  align-items-center">
                  <button mat-raised-button><mat-icon aria-hidden="false" aria-label="Ruota" fontIcon="sync"></mat-icon>Ruota</button>
                  <button mat-raised-button><mat-icon aria-hidden="false" aria-label="Ruota" fontIcon="delete"></mat-icon>Elimina</button>
                </mat-card-actions>
            </mat-card>


        </div>
  </div>
</mat-dialog-content>  
<mat-dialog-actions>
  
  <button mat-icon-button matPrefix (click)="f_input.click()">
    <mat-icon>attach_file</mat-icon>Aggiungi nuove foto
  </button>
  <input
              type="file"
              multiple
              hidden
              #f_input
              (change)="this.handleFileInputChange(f_input.files!)"
            />
  <button mat-button mat-dialog-close>Chiudi</button>
</mat-dialog-actions>
