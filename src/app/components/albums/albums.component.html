  
<div class="container">
    <div class="itemHead">
        <span>Album {{this.branca.toUpperCase()}}</span>
        <button mat-raised-button (click)="this.openNewAlbumDialog()"><mat-icon aria-hidden="false" aria-label="Ruota" fontIcon="add" ></mat-icon>Nuovo Album</button> 
        <div class="filer">
            <select name="branca" class="form-select">
                <option selected>Seleziona la banca</option>
                <option value="lc">Lupetti</option>
                <option value="eg">Reparto</option>
                <option value="rs">Clan</option>
              </select>
            <select name="anno" class="form-select">
                <option value="0" selected>Scegli un anno</option>
                <option value="2027">2027</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
            </select>
        </div>
    </div>
    
    <div class="item"  *ngFor="let al of (this.albums$ | async)!">

        <app-album [album]="al" (deleteAlbumEmitter)="deleteAlbumListener(al.id)"  />
    </div>
  </div>
